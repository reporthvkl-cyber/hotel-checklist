<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Room Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e0e0d8;padding:0 1rem;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:17px;font-weight:600;flex:1}
.sync-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:#666;background:#f5f5f0;padding:4px 10px;border-radius:20px;border:1px solid #e0e0d8}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0}
.sync-dot.ok{background:#1D9E75}.sync-dot.loading{background:#FAC775;animation:pulse 1s infinite}.sync-dot.err{background:#E24B4A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.view-bar{display:flex;background:#fff;border-bottom:1px solid #e0e0d8}
.view-btn{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:500;cursor:pointer;color:#888;border:none;background:transparent;border-bottom:2px solid transparent}
.view-btn.active{color:#0F6E56;border-bottom-color:#1D9E75}
.content{padding:1rem;max-width:700px;margin:0 auto}
.bldg-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.btab{padding:6px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:13px;cursor:pointer;color:#666;font-family:'Sarabun',sans-serif}
.btab.active{background:#0F6E56;color:#fff;border-color:#0F6E56}
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
.scard{background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #e8e8e2}
.scard-label{font-size:11px;color:#999;margin-bottom:2px}
.scard-val{font-size:20px;font-weight:600}
.floor-label{font-size:11px;color:#999;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:.75rem 0 .4rem}
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:.5rem}
.room-card{background:#fff;border:1px solid #e8e8e2;border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s}
.room-card:hover{border-color:#aaa}
.room-card.complete{border-color:#5DCAA5;background:#f0faf6}
.room-card.partial{border-color:#FAC775;background:#fffbf0}
.room-num{font-size:14px;font-weight:600;margin-bottom:3px}
.room-card.complete .room-num{color:#0F6E56}
.room-card.partial .room-num{color:#854F0B}
.room-checker{font-size:11px;color:#999;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots-row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;border:1px solid #ccc;flex-shrink:0}
.dot.ok{background:#1D9E75;border-color:#1D9E75}
.dot.bad{background:#E24B4A;border-color:#E24B4A}
.dot-lbl{font-size:10px;color:#aaa}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:500px){.overlay{align-items:center;padding:1rem}}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;padding:1.25rem}
@media(min-width:500px){.modal{border-radius:16px}}
.modal-title{font-size:17px;font-weight:600;margin-bottom:1rem}
.form-label{font-size:12px;color:#888;margin-bottom:4px;display:block}
.form-input{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:'Sarabun',sans-serif;background:#fafafa;color:#1a1a1a;margin-bottom:10px}
.check-item{padding:10px 0;border-bottom:1px solid #f0f0ea}
.check-item:last-of-type{border:none}
.check-header{display:flex;align-items:center;justify-content:space-between}
.check-name{font-size:14px;font-weight:500}
.toggle-grp{display:flex;gap:4px}
.tbtn{padding:5px 11px;font-size:12px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;font-family:'Sarabun',sans-serif;color:#666}
.tbtn.ok-on{background:#f0faf6;color:#0F6E56;border-color:#5DCAA5}
.tbtn.bad-on{background:#fff5f5;color:#A32D2D;border-color:#F09595}
.desc-box{width:100%;margin-top:8px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:'Sarabun',sans-serif;background:#fafafa;color:#1a1a1a;resize:none}
.media-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.media-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid #e0e0d8;flex-shrink:0}
.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover}
.media-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}
.upload-btn{width:64px;height:64px;border-radius:8px;border:1px dashed #ccc;background:#fafafa;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa;gap:2px;flex-shrink:0;font-size:10px}
.camera-btn{border-color:#5DCAA5;color:#0F6E56;background:#f0faf6}
.checker-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.checker-btn{padding:7px 16px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:13px;cursor:pointer;font-family:'Sarabun',sans-serif;color:#666}
.checker-btn.selected{background:#0F6E56;color:#fff;border-color:#0F6E56}
.modal-actions{display:flex;gap:8px;margin-top:1rem;justify-content:flex-end}
.btn-save{padding:9px 20px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-family:'Sarabun',sans-serif;font-weight:500}
.btn-cancel{padding:9px 16px;background:transparent;color:#888;border:1px solid #ddd;border-radius:8px;font-size:14px;cursor:pointer;font-family:'Sarabun',sans-serif}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.filter-sel{font-size:13px;padding:6px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;font-family:'Sarabun',sans-serif}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#888;cursor:pointer;font-family:'Sarabun',sans-serif}
.hist-card{background:#fff;border:1px solid #e8e8e2;border-radius:10px;padding:12px 14px;margin-bottom:8px}
.hist-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.hist-room{font-size:14px;font-weight:600}
.hist-time{font-size:11px;color:#aaa}
.hist-checker{font-size:12px;color:#888;margin-bottom:5px}
.hist-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.htag{font-size:11px;padding:3px 9px;border-radius:6px}
.htag.ok{background:#f0faf6;color:#0F6E56}
.htag.bad{background:#fff5f5;color:#A32D2D}
.hist-note{font-size:12px;color:#888;margin-top:5px}
.hist-media{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hist-thumb{width:52px;height:52px;border-radius:8px;overflow:hidden;border:1px solid #e0e0d8;cursor:pointer;flex-shrink:0}
.hist-thumb img,.hist-thumb video{width:100%;height:100%;object-fit:cover}
.empty-msg{text-align:center;padding:3rem 1rem;color:#bbb;font-size:14px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:center;justify-content:center;cursor:pointer}
.lightbox.open{display:flex}
.spinner{text-align:center;padding:3rem;color:#aaa;font-size:14px}
</style>
</head>
<body>
<div class="topbar">
  <svg width="22" height="22" fill="none" stroke="#0F6E56" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
  <h1>Hotel Checklist</h1>
  <div class="sync-badge"><span class="sync-dot loading" id="sync-dot"></span><span id="sync-label">กำลังเชื่อมต่อ...</span></div>
</div>
<div class="view-bar">
  <button class="view-btn active" id="vbtn-check" onclick="setView('check')">✓ เช็คห้อง</button>
  <button class="view-btn" id="vbtn-history" onclick="setView('history')">↩ ประวัติย้อนหลัง</button>
</div>
<div class="content">
  <div id="view-check">
    <div class="bldg-tabs" id="bldg-tabs"></div>
    <div class="summary-row" id="summary-row"></div>
    <div id="rooms-container"><div class="spinner">กำลังโหลด...</div></div>
  </div>
  <div id="view-history" style="display:none">
    <div class="filter-row">
      <span style="font-size:13px;color:#888">ตึก:</span>
      <select class="filter-sel" id="hf-bldg" onchange="renderHistory()">
        <option value="">ทั้งหมด</option>
        <option value="1">ตึก 1</option><option value="2">ตึก 2</option>
        <option value="3">ตึก 3</option><option value="4">ตึก 4</option><option value="5">ตึก 5</option>
      </select>
      <span style="font-size:13px;color:#888">สถานะ:</span>
      <select class="filter-sel" id="hf-status" onchange="renderHistory()">
        <option value="">ทั้งหมด</option>
        <option value="complete">ผ่านครบ</option>
        <option value="partial">มีปัญหา</option>
      </select>
      <button class="btn-sm" onclick="exportExcel()" style="background:#1D9E75;color:#fff;border-color:#1D9E75;font-weight:500">📊 Export Excel</button>
      <button class="btn-sm" onclick="clearHistory()">🗑 ล้างประวัติ</button>
    </div>
    <div id="history-list"><div class="spinner">กำลังโหลด...</div></div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title">ห้อง XXXX</div>
    <label class="form-label">ผู้ตรวจ</label>
    <div class="checker-btns">
      <button class="checker-btn" id="cb-Toy" onclick="toggleChecker('Toy')">Toy</button>
      <button class="checker-btn" id="cb-James" onclick="toggleChecker('James')">James</button>
    </div>
    <div id="modal-checks"></div>
    <label class="form-label" style="margin-top:10px">หมายเหตุทั่วไป</label>
    <textarea class="form-input" id="modal-note" rows="2" placeholder="หมายเหตุเพิ่มเติม..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-save" onclick="saveRoom()">💾 บันทึก</button>
    </div>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <div id="lightbox-content"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQUdxPaVVlUPEi4HB2SZh3Y7JBr7T_cRM",
  authDomain: "checklist-36415.firebaseapp.com",
  databaseURL: "https://checklist-36415-default-rtdb.firebaseio.com",
  projectId: "checklist-36415",
  storageBucket: "checklist-36415.firebasestorage.app",
  messagingSenderId: "941972200717",
  appId: "1:941972200717:web:a5285a6b43151af48ee444"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const BLDGS = [
  null,
  {name:'ตึก 1', floors:[{label:'ชั้น 1',from:1101,to:1116},{label:'ชั้น 2',from:1201,to:1216}]},
  {name:'ตึก 2', floors:[{label:'ชั้น 1',from:2101,to:2116},{label:'ชั้น 2',from:2201,to:2216}]},
  {name:'ตึก 3', floors:[{label:'ชั้น 1',from:3101,to:3112},{label:'ชั้น 2',from:3201,to:3212}]},
  {name:'ตึก 4', floors:[{label:'ชั้น 1',from:4101,to:4116},{label:'ชั้น 2',from:4201,to:4216}]},
  {name:'ตึก 5', floors:[{label:'ชั้น 1',from:5101,to:5116}]}
];
const CHECKS = ['ประตู','ตู้เซฟ','TV','สาย LAN'];
const ICONS = {ประตู:'🚪',ตู้เซฟ:'🔒',TV:'📺','สาย LAN':'🔌'};

let activeBldg = 1;
let currentView = 'check';
let modalRoom = null;
let modalState = {};
let modalMedia = {};
let dbData = {};
let dbHistory = [];
let selectedCheckers = [];

function setSyncStatus(s){
  document.getElementById('sync-dot').className = 'sync-dot '+s;
  document.getElementById('sync-label').textContent = s==='ok'?'ซิงค์แล้ว — ข้อมูลแชร์กันทุกเครื่อง':s==='loading'?'กำลังเชื่อมต่อ...':'ไม่สามารถเชื่อมต่อได้';
}

onValue(ref(db,'hotel_data'), snap => {
  dbData = snap.val() || {};
  setSyncStatus('ok');
  renderRooms();
}, () => setSyncStatus('err'));

onValue(ref(db,'hotel_history'), snap => {
  const val = snap.val();
  dbHistory = val ? Object.values(val).sort((a,b)=>b.ts-a.ts) : [];
  if(currentView==='history') renderHistory();
});

window.setView = function(v){
  currentView = v;
  document.getElementById('view-check').style.display = v==='check'?'block':'none';
  document.getElementById('view-history').style.display = v==='history'?'block':'none';
  document.getElementById('vbtn-check').className = 'view-btn'+(v==='check'?' active':'');
  document.getElementById('vbtn-history').className = 'view-btn'+(v==='history'?' active':'');
  if(v==='history') renderHistory();
};

window.setBldg = function(b){
  activeBldg = parseInt(b);
  renderRooms();
};

function getRoomStatus(r){
  const d = dbData[r];
  if(!d || !d.checks) return 'none';
  if(CHECKS.every(c=>d.checks[c]==='ok')) return 'complete';
  if(Object.values(d.checks).some(v=>v==='ok'||v==='bad')) return 'partial';
  return 'none';
}

function renderRooms(){
  const bldg = BLDGS[activeBldg];
  if(!bldg) return;

  // Tabs
  let tabHtml = '';
  for(let i=1;i<=5;i++){
    tabHtml += `<button class="btab${i===activeBldg?' active':''}" onclick="setBldg(${i})">${BLDGS[i].name}</button>`;
  }
  document.getElementById('bldg-tabs').innerHTML = tabHtml;

  // Summary
  let total=0,done=0,issues=0;
  bldg.floors.forEach(f=>{for(let r=f.from;r<=f.to;r++){total++;const s=getRoomStatus(r);if(s==='complete')done++;else if(s==='partial')issues++;}});
  document.getElementById('summary-row').innerHTML=`
    <div class="scard"><div class="scard-label">ทั้งหมด</div><div class="scard-val">${total}</div></div>
    <div class="scard"><div class="scard-label">ผ่านครบ</div><div class="scard-val" style="color:#0F6E56">${done}</div></div>
    <div class="scard"><div class="scard-label">มีปัญหา</div><div class="scard-val" style="color:#A32D2D">${issues}</div></div>
    <div class="scard"><div class="scard-label">ยังไม่เช็ค</div><div class="scard-val" style="color:#aaa">${total-done-issues}</div></div>`;

  // Rooms
  let html = '';
  bldg.floors.forEach(f=>{
    html += `<div class="floor-label">${f.label}</div><div class="rooms-grid">`;
    for(let r=f.from;r<=f.to;r++){
      const s = getRoomStatus(r);
      const d = dbData[r];
      const checker = d&&d.checker?`<div class="room-checker">👤 ${d.checker}</div>`:'';
      const dots = CHECKS.map(c=>{
        const v = d&&d.checks?d.checks[c]:'';
        return `<span class="dot${v==='ok'?' ok':v==='bad'?' bad':''}"></span><span class="dot-lbl">${c}</span>`;
      }).join('');
      html += `<div class="room-card${s==='complete'?' complete':s==='partial'?' partial':''}" onclick="openRoom(${r})">
        <div class="room-num">${r}</div>${checker}
        <div class="dots-row">${dots}</div>
      </div>`;
    }
    html += '</div>';
  });
  document.getElementById('rooms-container').innerHTML = html;
}

window.openRoom = function(room){
  modalRoom = room;
  const d = dbData[room]||{};
  modalState = {checks:{...(d.checks||{})},note:d.note||''};
  modalMedia = {};
  CHECKS.forEach(c=>{modalMedia[c]=[...(d.media&&d.media[c]?d.media[c]:[])];});
  const saved = d.checker||'';
  selectedCheckers = saved?saved.split(',').map(s=>s.trim()).filter(Boolean):[];
  document.getElementById('modal-title').textContent = `ห้อง ${room}`;
  document.getElementById('modal-note').value = modalState.note;
  document.getElementById('cb-Toy').className = 'checker-btn'+(selectedCheckers.includes('Toy')?' selected':'');
  document.getElementById('cb-James').className = 'checker-btn'+(selectedCheckers.includes('James')?' selected':'');
  renderModalChecks();
  document.getElementById('overlay').classList.add('open');
};

window.toggleChecker = function(name){
  selectedCheckers = selectedCheckers.includes(name)?selectedCheckers.filter(c=>c!==name):[...selectedCheckers,name];
  document.getElementById('cb-Toy').className = 'checker-btn'+(selectedCheckers.includes('Toy')?' selected':'');
  document.getElementById('cb-James').className = 'checker-btn'+(selectedCheckers.includes('James')?' selected':'');
};

function mediaRowHtml(c){
  const items = (modalMedia[c]||[]).map((m,i)=>{
    const isVid = m.type&&m.type.startsWith('video');
    return `<div class="media-thumb">${isVid?`<video src="${m.data}" muted></video>`:`<img src="${m.data}">`}<button class="media-del" onclick="removeMedia('${c}',${i})">✕</button></div>`;
  }).join('');
  return `<div class="media-row">${items}
    <label class="upload-btn">📁<span>คลัง</span><input type="file" accept="image/*,video/*" style="display:none" onchange="addMedia('${c}',this)"></label>
    <label class="upload-btn camera-btn">📷<span>ถ่ายรูป</span><input type="file" accept="image/*" capture="environment" style="display:none" onchange="addMedia('${c}',this)"></label>
    <label class="upload-btn camera-btn">🎥<span>วิดีโอ</span><input type="file" accept="video/*" capture="environment" style="display:none" onchange="addMedia('${c}',this)"></label>
  </div>`;
}

function renderModalChecks(){
  document.getElementById('modal-checks').innerHTML = CHECKS.map(c=>{
    const v = modalState.checks[c];
    const isBad = v==='bad';
    return `<div class="check-item" id="ci-${c}">
      <div class="check-header">
        <span class="check-name">${ICONS[c]} ${c}</span>
        <div class="toggle-grp" id="tg-${c}">
          <button class="tbtn${v==='ok'?' ok-on':''}" onclick="setCheck('${c}','ok')">✓ ปกติ</button>
          <button class="tbtn${v==='bad'?' bad-on':''}" onclick="setCheck('${c}','bad')">✕ มีปัญหา</button>
        </div>
      </div>
      <div id="da-${c}">${isBad?`<textarea class="desc-box" rows="2" id="desc-${c}" placeholder="อธิบายปัญหา...">${modalState.checks[c+'_desc']||''}</textarea>${mediaRowHtml(c)}`:''}</div>
    </div>`;
  }).join('');
}

window.setCheck = function(c,v){
  const el = document.getElementById('desc-'+c);
  if(el) modalState.checks[c+'_desc'] = el.value;
  if(modalState.checks[c]===v){delete modalState.checks[c];delete modalState.checks[c+'_desc'];}
  else modalState.checks[c]=v;
  const nv = modalState.checks[c];
  const isBad = nv==='bad';
  document.getElementById('tg-'+c).innerHTML = `
    <button class="tbtn${nv==='ok'?' ok-on':''}" onclick="setCheck('${c}','ok')">✓ ปกติ</button>
    <button class="tbtn${nv==='bad'?' bad-on':''}" onclick="setCheck('${c}','bad')">✕ มีปัญหา</button>`;
  document.getElementById('da-'+c).innerHTML = isBad?`<textarea class="desc-box" rows="2" id="desc-${c}" placeholder="อธิบายปัญหา...">${modalState.checks[c+'_desc']||''}</textarea>${mediaRowHtml(c)}`:'';
  if(isBad) setTimeout(()=>{const el=document.getElementById('desc-'+c);if(el)el.focus();},50);
};

window.removeMedia = function(c,i){
  const el=document.getElementById('desc-'+c);if(el)modalState.checks[c+'_desc']=el.value;
  modalMedia[c].splice(i,1);
  document.getElementById('da-'+c).innerHTML = `<textarea class="desc-box" rows="2" id="desc-${c}" placeholder="อธิบายปัญหา...">${modalState.checks[c+'_desc']||''}</textarea>${mediaRowHtml(c)}`;
};

window.addMedia = function(c,input){
  const file=input.files[0];if(!file)return;
  if(!modalMedia[c])modalMedia[c]=[];
  if(modalMedia[c].length>=3){alert('ใส่ได้สูงสุด 3 ไฟล์ต่อรายการครับ');input.value='';return;}
  if(file.size>5*1024*1024){alert('ไฟล์ใหญ่เกิน 5MB');return;}
  const el=document.getElementById('desc-'+c);if(el)modalState.checks[c+'_desc']=el.value;
  const reader=new FileReader();
  reader.onload=e=>{
    modalMedia[c].push({data:e.target.result,type:file.type,name:file.name});
    document.getElementById('da-'+c).innerHTML = `<textarea class="desc-box" rows="2" id="desc-${c}" placeholder="อธิบายปัญหา...">${modalState.checks[c+'_desc']||''}</textarea>${mediaRowHtml(c)}`;
  };
  reader.readAsDataURL(file);
};

window.saveRoom = async function(){
  CHECKS.forEach(c=>{const el=document.getElementById('desc-'+c);if(el)modalState.checks[c+'_desc']=el.value;});
  const checker = selectedCheckers.join(', ');
  const note = document.getElementById('modal-note').value.trim();
  const ts = Date.now();
  const entry = {checks:{...modalState.checks},checker,note,media:{},ts,
    time:new Date().toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})};
  CHECKS.forEach(c=>{entry.media[c]=[...(modalMedia[c]||[])];});
  setSyncStatus('loading');
  await set(ref(db,`hotel_data/${modalRoom}`),entry);
  const allOk=CHECKS.every(c=>modalState.checks[c]==='ok');
  await set(ref(db,`hotel_history/${ts}`),{...entry,room:modalRoom,bldg:String(modalRoom)[0],status:allOk?'complete':'partial'});
  setSyncStatus('ok');
  closeModal();
};

window.closeModal = function(){document.getElementById('overlay').classList.remove('open');};

window.openLightbox = function(src,isVid){
  document.getElementById('lightbox-content').innerHTML=isVid?`<video src="${src}" controls style="max-width:94vw;max-height:90vh"></video>`:`<img src="${src}" style="max-width:94vw;max-height:90vh;border-radius:8px">`;
  document.getElementById('lightbox').classList.add('open');
};

function renderHistory(){
  const bf=document.getElementById('hf-bldg').value;
  const sf=document.getElementById('hf-status').value;
  let h=dbHistory;
  if(bf)h=h.filter(x=>x.bldg===bf);
  if(sf)h=h.filter(x=>x.status===sf);
  const el=document.getElementById('history-list');
  if(!h.length){el.innerHTML='<div class="empty-msg">ยังไม่มีประวัติการตรวจ</div>';return;}
  el.innerHTML=h.map(entry=>{
    const tags=CHECKS.map(c=>{
      const v=entry.checks[c];if(!v)return'';
      const desc=entry.checks[c+'_desc'];
      return `<span class="htag ${v==='ok'?'ok':'bad'}">${ICONS[c]} ${c}: ${v==='ok'?'ปกติ':'มีปัญหา'}${desc?` — ${desc}`:''}</span>`;
    }).join('');
    let mediaHtml='';
    CHECKS.forEach(c=>{(entry.media&&entry.media[c]||[]).forEach(m=>{
      const isVid=m.type&&m.type.startsWith('video');
      mediaHtml+=`<div class="hist-thumb" onclick="openLightbox('${m.data}',${isVid})">${isVid?`<video src="${m.data}" muted></video>`:`<img src="${m.data}">`}</div>`;
    });});
    return `<div class="hist-card">
      <div class="hist-top"><span class="hist-room">ตึก ${entry.bldg} — ห้อง ${entry.room}</span><span class="hist-time">${entry.time}</span></div>
      ${entry.checker?`<div class="hist-checker">👤 ${entry.checker}</div>`:''}
      <div class="hist-tags">${tags||'<span style="font-size:12px;color:#ccc">ยังไม่เช็ครายการ</span>'}</div>
      ${entry.note?`<div class="hist-note">📝 ${entry.note}</div>`:''}
      ${mediaHtml?`<div class="hist-media">${mediaHtml}</div>`:''}
    </div>`;
  }).join('');
}

window.clearHistory = async function(){
  if(!confirm('ล้างประวัติทั้งหมดใช่ไหม?'))return;
  await remove(ref(db,'hotel_history'));
};

window.exportExcel = function(){
  const bf=document.getElementById('hf-bldg').value;
  const sf=document.getElementById('hf-status').value;
  let h=dbHistory;
  if(bf)h=h.filter(x=>x.bldg===bf);
  if(sf)h=h.filter(x=>x.status===sf);
  if(!h.length){alert('ไม่มีข้อมูลสำหรับ Export');return;}
  const rows=[['วันที่/เวลา','ตึก','ห้อง','ผู้ตรวจ','ประตู','ปัญหาประตู','ตู้เซฟ','ปัญหาตู้เซฟ','TV','ปัญหา TV','สาย LAN','ปัญหาสาย LAN','หมายเหตุ','สถานะรวม']];
  h.forEach(e=>{rows.push([
    e.time||'','ตึก '+e.bldg,e.room||'',e.checker||'',
    e.checks['ประตู']==='ok'?'ปกติ':e.checks['ประตู']==='bad'?'มีปัญหา':'-',e.checks['ประตู_desc']||'',
    e.checks['ตู้เซฟ']==='ok'?'ปกติ':e.checks['ตู้เซฟ']==='bad'?'มีปัญหา':'-',e.checks['ตู้เซฟ_desc']||'',
    e.checks['TV']==='ok'?'ปกติ':e.checks['TV']==='bad'?'มีปัญหา':'-',e.checks['TV_desc']||'',
    e.checks['สาย LAN']==='ok'?'ปกติ':e.checks['สาย LAN']==='bad'?'มีปัญหา':'-',e.checks['สาย LAN_desc']||'',
    e.note||'',e.status==='complete'?'ผ่านครบ':'มีปัญหา'
  ]);});
  const XLSX=window.XLSX;
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:18},{wch:8},{wch:8},{wch:14},{wch:10},{wch:20},{wch:10},{wch:20},{wch:10},{wch:20},{wch:10},{wch:20},{wch:24},{wch:12}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'รายงานตรวจห้อง');
  const bf2=bf?`_ตึก${bf}`:'_ทุกตึก';
  const sf2=sf==='complete'?'_ผ่านครบ':sf==='partial'?'_มีปัญหา':'';
  const dateStr=new Date().toLocaleDateString('th-TH').replace(/\//g,'-');
  XLSX.writeFile(wb,`hotel-checklist${bf2}${sf2}_${dateStr}.xlsx`);
};

renderRooms();
</script>
