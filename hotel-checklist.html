<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Room Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e0e0d8;padding:0 1rem;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:17px;font-weight:600;flex:1}
.sync-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:#666;background:#f5f5f0;padding:4px 10px;border-radius:20px;border:1px solid #e0e0d8}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0}
.sync-dot.ok{background:#1D9E75}.sync-dot.loading{background:#FAC775;animation:pulse 1s infinite}.sync-dot.err{background:#E24B4A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.view-bar{display:flex;background:#fff;border-bottom:1px solid #e0e0d8}
.view-btn{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:500;cursor:pointer;color:#888;border:none;background:transparent;border-bottom:2px solid transparent}
.view-btn.active{color:#0F6E56;border-bottom-color:#1D9E75}
.content{padding:1rem;max-width:700px;margin:0 auto}
.bldg-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.floor-label{font-size:11px;color:#999;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:.75rem 0 .4rem}
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:.5rem}
.btab{padding:6px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:13px;cursor:pointer;color:#666;font-family:'Sarabun',sans-serif;display:inline-flex;align-items:center;gap:8px}
.btab.active{background:#0F6E56;color:#fff;border-color:#0F6E56}
.bd{font-size:11px;background:#FAEEDA;color:#854F0B;padding:1px 8px;border-radius:10px}
.card{background:#fff;border:1px solid #e8e8e2;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:12px}
.grid2>.card{margin-bottom:0}
.lbl{font-size:12px;color:#888;margin-bottom:10px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:12px}
.metric{background:#fff;border:1px solid #e8e8e2;border-radius:10px;padding:10px 12px}
.ml{font-size:12px;color:#888;display:flex;align-items:center;gap:6px}
.md{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.mv{font-size:22px;font-weight:600;margin-top:2px}
.ms{font-size:11px;color:#aaa}
.pbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#f0f0ea;width:100%}
.pbar.lg{height:12px;border-radius:6px}
.pbar i{display:block}
.srow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.srow:last-child{margin-bottom:0}
.sn{width:56px;flex-shrink:0}
.sgrow{flex:1}
.sbar{flex:1;height:8px;border-radius:4px;background:#f0f0ea}
.sbar i{display:block;height:8px;border-radius:4px;background:#E24B4A}
.sc{width:44px;text-align:right;flex-shrink:0;font-size:12px;color:#777}
b.sc{font-size:13px;color:#1a1a1a;font-weight:600}
.pick{cursor:pointer;padding:4px 6px;margin:0 -6px 6px;border-radius:8px}
.pick.on{background:#E1F5EE}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#888;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.bt{font-weight:600;font-size:15px}
.bs{font-size:11px;color:#aaa}
.bp{text-align:right}
.bpv{font-size:24px;font-weight:600}
.irow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #f0f0ea;font-size:13px;cursor:pointer}
.lbl+.irow{border-top:none}
.ichip{font-size:12px;background:#fff5f5;color:#A32D2D;padding:2px 10px;border-radius:8px;white-space:nowrap}
.idesc{color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{font-size:13px;color:#aaa}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 12px;border-radius:16px;border:1px solid #ddd;background:#fff;color:#666;cursor:pointer;font-family:'Sarabun',sans-serif}
.chip.on{background:#E1F5EE;color:#0F6E56;border-color:#5DCAA5}
.rc{background:#fff;border:1px solid #e8e8e2;border-radius:10px;padding:8px 10px;cursor:pointer}
.rc:hover{border-color:#aaa}
.rc-n{font-size:14px;font-weight:600}
.rc-s{font-size:11px;color:#aaa;margin-top:2px}
.rc.ok{background:#f0faf6;border-color:#5DCAA5}.rc.ok .rc-n,.rc.ok .rc-s{color:#0F6E56}
.rc.bad{background:#fffbf0;border-color:#FAC775}.rc.bad .rc-n,.rc.bad .rc-s{color:#854F0B}
.rc.inc{background:#f3f8fd;border-color:#B5D4F4}.rc.inc .rc-n,.rc.inc .rc-s{color:#185FA5}
.rc-m{font-size:11px;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:500px){.overlay{align-items:center;padding:1rem}}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;padding:1.25rem}
@media(min-width:500px){.modal{border-radius:16px}}
.modal-title{font-size:17px;font-weight:600;margin-bottom:1rem}
.form-label{font-size:12px;color:#888;margin-bottom:4px;display:block}
.form-input{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:'Sarabun',sans-serif;background:#fafafa;color:#1a1a1a;margin-bottom:10px}
.check-item{padding:10px 0;border-bottom:1px solid #f0f0ea}
.check-item:last-of-type{border:none}
.check-header{display:flex;align-items:center;justify-content:space-between}
.check-name{font-size:14px;font-weight:500}
.toggle-grp{display:flex;gap:4px}
.tbtn{padding:5px 11px;font-size:12px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;font-family:'Sarabun',sans-serif;color:#666}
.tbtn.ok-on{background:#f0faf6;color:#0F6E56;border-color:#5DCAA5}
.tbtn.bad-on{background:#fff5f5;color:#A32D2D;border-color:#F09595}
.desc-box{width:100%;margin-top:8px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:'Sarabun',sans-serif;background:#fafafa;color:#1a1a1a;resize:none}
.media-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.media-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid #e0e0d8;flex-shrink:0}
.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover}
.media-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}
.upload-btn{width:64px;height:64px;border-radius:8px;border:1px dashed #ccc;background:#fafafa;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa;gap:2px;flex-shrink:0;font-size:10px}
.camera-btn{border-color:#5DCAA5;color:#0F6E56;background:#f0faf6}
.checker-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.checker-btn{padding:7px 16px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:13px;cursor:pointer;font-family:'Sarabun',sans-serif;color:#666}
.checker-btn.selected{background:#0F6E56;color:#fff;border-color:#0F6E56}
.modal-actions{display:flex;gap:8px;margin-top:1rem;justify-content:flex-end}
.btn-save{padding:9px 20px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-family:'Sarabun',sans-serif;font-weight:500}
.btn-cancel{padding:9px 16px;background:transparent;color:#888;border:1px solid #ddd;border-radius:8px;font-size:14px;cursor:pointer;font-family:'Sarabun',sans-serif}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.filter-sel{font-size:13px;padding:6px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;font-family:'Sarabun',sans-serif}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#888;cursor:pointer;font-family:'Sarabun',sans-serif}
.hist-card{background:#fff;border:1px solid #e8e8e2;border-radius:10px;padding:12px 14px;margin-bottom:8px}
.hist-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.hist-room{font-size:14px;font-weight:600}
.hist-time{font-size:11px;color:#aaa}
.hist-checker{font-size:12px;color:#888;margin-bottom:5px}
.hist-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.htag{font-size:11px;padding:3px 9px;border-radius:6px}
.htag.ok{background:#f0faf6;color:#0F6E56}
.htag.bad{background:#fff5f5;color:#A32D2D}
.hist-note{font-size:12px;color:#888;margin-top:5px}
.hist-media{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hist-thumb{width:52px;height:52px;border-radius:8px;overflow:hidden;border:1px solid #e0e0d8;cursor:pointer;flex-shrink:0}
.hist-thumb img,.hist-thumb video{width:100%;height:100%;object-fit:cover}
.empty-msg{text-align:center;padding:3rem 1rem;color:#bbb;font-size:14px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:center;justify-content:center;cursor:pointer}
.lightbox.open{display:flex}
.spinner{text-align:center;padding:3rem;color:#aaa;font-size:14px}
</style>
</head>
<body>
<div class="topbar">
  <svg width="22" height="22" fill="none" stroke="#0F6E56" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
  <h1>Hotel Checklist</h1>
  <div class="sync-badge"><span class="sync-dot loading" id="sync-dot"></span><span id="sync-label">กำลังเชื่อมต่อ...</span></div>
</div>
<div class="view-bar">
  <button class="view-btn active" id="vbtn-check" onclick="setView('check')">✓ เช็คห้อง</button>
  <button class="view-btn" id="vbtn-history" onclick="setView('history')">↩ ประวัติย้อนหลัง</button>
</div>
<div class="content">
  <div id="view-check">
    <div id="overall"></div>
    <div class="bldg-tabs" id="bldg-tabs"></div>
    <div id="bldg-sum"></div>
    <div id="rooms-container"><div class="spinner">กำลังโหลด...</div></div>
  </div>
  <div id="view-history" style="display:none">
    <div class="filter-row">
      <span style="font-size:13px;color:#888">ตึก:</span>
      <select class="filter-sel" id="hf-bldg" onchange="renderHistory()">
        <option value="">ทั้งหมด</option>
        <option value="1">ตึก 1</option><option value="2">ตึก 2</option>
        <option value="3">ตึก 3</option><option value="4">ตึก 4</option><option value="5">ตึก 5</option>
      </select>
      <span style="font-size:13px;color:#888">สถานะ:</span>
      <select class="filter-sel" id="hf-status" onchange="renderHistory()">
        <option value="">ทั้งหมด</option>
        <option value="complete">ผ่านครบ</option>
        <option value="partial">มีปัญหา</option>
      </select>
      <button class="btn-sm" onclick="exportExcel()" style="background:#1D9E75;color:#fff;border-color:#1D9E75;font-weight:500">📊 Export Excel</button>
      <button class="btn-sm" onclick="clearHistory()">🗑 ล้างประวัติ</button>
    </div>
    <div id="history-list"><div class="spinner">กำลังโหลด...</div></div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title">ห้อง XXXX</div>
    <label class="form-label">ผู้ตรวจ</label>
    <div class="checker-btns">
      <button class="checker-btn" id="cb-Toy" onclick="toggleChecker('Toy')">Toy</button>
      <button class="checker-btn" id="cb-James" onclick="toggleChecker('James')">James</button>
    </div>
    <div id="modal-checks"></div>
    <label class="form-label" style="margin-top:10px">หมายเหตุทั่วไป</label>
    <textarea class="form-input" id="modal-note" rows="2" placeholder="หมายเหตุเพิ่มเติม..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-save" onclick="saveRoom()">💾 บันทึก</button>
    </div>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <div id="lightbox-content"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQUdxPaVVlUPEi4HB2SZh3Y7JBr7T_cRM",
  authDomain: "checklist-36415.firebaseapp.com",
  databaseURL: "https://checklist-36415-default-rtdb.firebaseio.com",
  projectId: "checklist-36415",
  storageBucket: "checklist-36415.firebasestorage.app",
  messagingSenderId: "941972200717",
  appId: "1:941972200717:web:a5285a6b43151af48ee444"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const BLDGS = [
  null,
  {name:'ตึก 1', floors:[{label:'ชั้น 1',from:1101,to:1116},{label:'ชั้น 2',from:1201,to:1216}]},
  {name:'ตึก 2', floors:[{label:'ชั้น 1',from:2101,to:2116},{label:'ชั้น 2',from:2201,to:2216}]},
  {name:'ตึก 3', floors:[{label:'ชั้น 1',from:3101,to:3112},{label:'ชั้น 2',from:3201,to:3212}]},
  {name:'ตึก 4', floors:[{label:'ชั้น 1',from:4101,to:4116},{label:'ชั้น 2',from:4201,to:4216}]},
  {name:'ตึก 5', floors:[{label:'ชั้น 1',from:5101,to:5116}]}
];
const CHECKS = ['ประตู','ตู้เซฟ','TV','สาย LAN'];
const STATUS_CHECKS = ['ประตู','ตู้เซฟ','TV']; // สาย LAN เป็นแค่บันทึกว่าทำแล้ว ไม่นับในสถานะห้อง
const ICONS = {ประตู:'🚪',ตู้เซฟ:'🔒',TV:'📺','สาย LAN':'🔌'};

let activeBldg = 1;
let flt = 'all';
let currentView = 'check';
let modalRoom = null;
let modalState = {};
let modalMedia = {};
let dbData = {};
let dbHistory = [];
let selectedCheckers = [];
let tvSel = '';
let tvOther = '';
const TV_MODELS = ['LG 42 นิ้ว','LG Smart TV 43 นิ้ว'];
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

function setSyncStatus(s){
  document.getElementById('sync-dot').className = 'sync-dot '+s;
  document.getElementById('sync-label').textContent = s==='ok'?'ซิงค์แล้ว — ข้อมูลแชร์กันทุกเครื่อง':s==='loading'?'กำลังเชื่อมต่อ...':'ไม่สามารถเชื่อมต่อได้';
}

onValue(ref(db,'hotel_data'), snap => {
  dbData = snap.val() || {};
  setSyncStatus('ok');
  renderRooms();
}, () => setSyncStatus('err'));

onValue(ref(db,'hotel_history'), snap => {
  const val = snap.val();
  dbHistory = val ? Object.values(val).sort((a,b)=>b.ts-a.ts) : [];
  if(currentView==='history') renderHistory();
});

window.setView = function(v){
  currentView = v;
  document.getElementById('view-check').style.display = v==='check'?'block':'none';
  document.getElementById('view-history').style.display = v==='history'?'block':'none';
  document.getElementById('vbtn-check').className = 'view-btn'+(v==='check'?' active':'');
  document.getElementById('vbtn-history').className = 'view-btn'+(v==='history'?' active':'');
  if(v==='history') renderHistory();
};

window.setBldg = function(b){
  activeBldg = parseInt(b);
  flt = 'all';
  renderRooms();
};
window.setFlt = function(f){ flt = f; renderRooms(); };

// ==DASH-BEGIN==
const rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const pct=(a,b)=>b?Math.round(a/b*100):0;
function roomStat(r){
  const d=dbData[r]; if(!d||!d.checks) return 'none';
  const c=d.checks;
  if(STATUS_CHECKS.some(k=>c[k]==='bad')) return 'bad';
  if(STATUS_CHECKS.every(k=>c[k]==='ok')) return 'ok';
  return STATUS_CHECKS.some(k=>c[k]==='ok')?'inc':'none';
}
function bldgRooms(b){ return BLDGS[b].floors.flatMap(f=>rng(f.from,f.to)); }
function sumRooms(list){
  const s={t:list.length,ok:0,bad:0,inc:0,none:0,cat:{},tv:{m0:0,m1:0,oth:0,none:0},iss:[]};
  CHECKS.forEach(c=>{ s.cat[c]=0; });
  list.forEach(r=>{
    s[roomStat(r)]++;
    const d=dbData[r]||{}, ck=d.checks||{};
    CHECKS.forEach(c=>{ if(ck[c]==='bad'){ s.cat[c]++; s.iss.push({r:r,c:c,d:ck[c+'_desc']||'',ts:d.ts||0}); } });
    const m=d.tvModel;
    if(!m) s.tv.none++; else if(m===TV_MODELS[0]) s.tv.m0++; else if(m===TV_MODELS[1]) s.tv.m1++; else s.tv.oth++;
  });
  s.iss.sort((a,b)=>b.ts-a.ts);
  return s;
}
// ==DASH-END==

const ST_LBL={ok:'✓ ผ่านครบ',bad:'! มีปัญหา',inc:'ตรวจไม่ครบ',none:'ยังไม่ตรวจ'};
const TV_COL=['#1D9E75','#378ADD','#7F77DD','#B4B2A9'];
function pbar(s,cls){
  const w=n=>(s.t?n/s.t*100:0)+'%';
  return `<div class="pbar${cls||''}"><i style="width:${w(s.ok)};background:#1D9E75"></i><i style="width:${w(s.bad)};background:#EF9F27"></i><i style="width:${w(s.inc)};background:#85B7EB"></i></div>`;
}
function metric(label,val,sub,col){
  return `<div class="metric"><div class="ml"><span class="md" style="background:${col}"></span>${label}</div><div class="mv">${val}</div><div class="ms">${sub}</div></div>`;
}
function catCard(s){
  const mx=Math.max(1,...CHECKS.map(c=>s.cat[c]));
  return `<div class="card"><div class="lbl">ปัญหาแยกตามรายการ</div>${CHECKS.map(c=>`<div class="srow"><span class="sn">${ICONS[c]} ${c}</span><div class="sbar"><i style="width:${s.cat[c]/mx*100}%"></i></div><b class="sc">${s.cat[c]}</b></div>`).join('')}</div>`;
}

function renderRooms(){
  const bldg=BLDGS[activeBldg]; if(!bldg) return;
  const per={}; for(let b=1;b<=5;b++) per[b]=sumRooms(bldgRooms(b));
  const S=sumRooms([1,2,3,4,5].flatMap(bldgRooms)), chk=S.ok+S.bad+S.inc;

  const legend='<div class="legend"><span><i class="md" style="background:#1D9E75"></i>ผ่านครบ</span><span><i class="md" style="background:#EF9F27"></i>มีปัญหา</span><span><i class="md" style="background:#85B7EB"></i>ตรวจไม่ครบ</span><span><i class="md" style="background:#f0f0ea;border:1px solid #ddd"></i>ยังไม่ตรวจ</span></div>';
  const bRows=[1,2,3,4,5].map(b=>{const s=per[b];return `<div class="srow pick${b===activeBldg?' on':''}" onclick="setBldg(${b})"><span class="sn">ตึก ${b}</span><div class="sgrow">${pbar(s)}</div><span class="sc">${s.ok+s.bad+s.inc}/${s.t}</span></div>`;}).join('');
  document.getElementById('overall').innerHTML =

window.openRoom = function(room){
  modalRoom = room;

  modalMedia = {};
  CHECKS.forEach(c=>{modalMedia[c]=[...(d.media&&d.media[c]?d.media[c]:[])];});
  const saved = d.checker||'';
  selectedCheckers = saved?saved.split(',').map(s=>s.trim()).filter(Boolean):[];

  tvSel = TV_MODELS.includes(tm)?tm:(tm?'อื่นๆ':'');
  tvOther = TV_MODELS.includes(tm)?'':(tm==='อื่นๆ'?'':tm);

window.removeMedia = function(c,i){
  const el=document.getElementById('desc-'+c);if(el)modalState.checks[c+'_desc']=el.value;
  modalMedia[c].splice(i,1);
  document.getElementById('da-'+c).innerHTML = `<textarea class="desc-box" rows="2" id="desc-${c}" placeholder="อธิบายปัญหา...">${modalState.checks[c+'_desc']||''}</textarea>${mediaRowHtml(c)}`;

window.addMedia = function(c,input){
  const file=input.files[0];if(!file)return;
  if(!modalMedia[c])modalMedia[c]=[];
  if(modalMedia[c].length>=3){alert('ใส่ได้สูงสุด 3 ไฟล์ต่อรายการครับ');input.value='';return;}
  if(file.size>5*1024*1024){alert('ไฟล์ใหญ่เกิน 5MB');return;}
  const el=document.getElementById('desc-'+c);if(el)modalState.checks[c+'_desc']=el.value;
  const reader=new FileReader();
  reader.onload=e=>{
    modalMedia[c].push({data:e.target.result,type:file.type,name:file.name});
    document.getElementById('da-'+c).innerHTML = `<textarea class="desc-box" rows="2" id="desc-${c}" placeholder="อธิบายปัญหา...">${modalState.checks[c+'_desc']||''}</textarea>${mediaRowHtml(c)}`;
  };
  reader.readAsDataURL(file);
};

const TH_MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function monthKeyOf(e){ if(!e||!e.ts) return 0; const d=new Date(e.ts); return d.getFullYear()*100+d.getMonth()+1; }
function monthLabel(k){ if(!k) return 'ไม่ระบุเดือน'; const y=Math.floor(k/100), m=k%100; return TH_MONTHS[m-1]+' '+(y+543); }
function roomsOfBldg(b){ return BLDGS[b].floors.reduce((n,f)=>n+(f.to-f.from+1),0); }
function entryCat(e){ const c=(e&&e.checks)||{}; if(STATUS_CHECKS.some(k=>c[k]==='bad')) return 'bad'; if(STATUS_CHECKS.every(k=>c[k]==='ok')) return 'pass'; return 'inc'; }
function statusOf(e){ return entryCat(e)==='pass'?'complete':'partial'; }
// นับจากการบันทึกครั้งล่าสุดของแต่ละห้อง
function tally(entries){
  const latest={};
  entries.forEach(e=>{ const k=String(e.room); if(!latest[k]||(e.ts||0)>(latest[k].ts||0)) latest[k]=e; });
  const st={saves:entries.length,rooms:0,pass:0,bad:0,inc:0,issues:{}};
  CHECKS.forEach(c=>{ st.issues[c]=0; });
  Object.values(latest).forEach(e=>{
    st.rooms++; st[entryCat(e)]++;
    const ck=e.checks||{};
    CHECKS.forEach(c=>{ if(ck[c]==='bad') st.issues[c]++; });
  });
  return st;
}

const XC={green:'FF0F6E56',greenLt:'FFE1F5EE',red:'FFA32D2D',redLt:'FFFCEBEB',amber:'FF854F0B',amberLt:'FFFAEEDA',gray:'FF777777',grayLt:'FFF5F5F0',line:'FFE0E0D8',white:'FFFFFFFF'};
const XFONT='Tahoma';
const xSide={style:'thin',color:{argb:XC.line}};
const xBorder={top:xSide,left:xSide,bottom:xSide,right:xSide};
function xFill(argb){ return {type:'pattern',pattern:'solid',fgColor:{argb:argb}}; }
function xTitle(ws,title,sub,lastCol){
  ws.mergeCells(1,1,1,lastCol);

  const row=ws.getRow(rowNum);

function xPct(v){ return v>=0.9?{color:XC.green,bg:XC.greenLt}:v>=0.7?{color:XC.amber,bg:XC.amberLt}:{color:XC.red,bg:XC.redLt}; }
function xSheet(wb,name){

}

function buildReportWorkbook(ExcelJS,all,bf,sf){
  const wb=new ExcelJS.Workbook();
  wb.creator='Hotel Checklist'; wb.created=new Date();
  const scope=bf?all.filter(x=>String(x.bldg)===String(bf)):all;
  const byMonth={};
  scope.forEach(e=>{ const k=monthKeyOf(e); (byMonth[k]=byMonth[k]||[]).push(e); });
  const keys=Object.keys(byMonth).map(Number).sort((a,b)=>a-b);
  const TOTAL=bf?roomsOfBldg(+bf):[1,2,3,4,5].reduce((n,b)=>n+roomsOfBldg(b),0);
  const scopeLabel=bf?('ตึก '+bf):'ทุกตึก';
  const today=new Date().toLocaleDateString('th-TH',{dateStyle:'long'});

  // ---------- Sheet 1: สรุปรายเดือน ----------
  const s1=xSheet(wb,'สรุปรายเดือน');
  [14,13,13,12,11,11,13,13,12,12,11,13].forEach((w,i)=>{ s1.getColumn(i+1).width=w; });
  xTitle(s1,'สรุปผลการตรวจห้องพักรายเดือน','ออกรายงาน '+today+' · ขอบเขต: '+scopeLabel,12);
  s1.getCell('A3').value='ห้องทั้งหมด'; s1.getCell('A3').font={name:XFONT,size:10,bold:true,color:{argb:XC.gray}};
  s1.getCell('B3').value=TOTAL; s1.getCell('B3').font={name:XFONT,size:10,bold:true}; s1.getCell('B3').alignment={horizontal:'center'};
  s1.getCell('C3').value='ห้อง'; s1.getCell('C3').font={name:XFONT,size:10,color:{argb:XC.gray}};
  xHeader(s1,4,['เดือน','บันทึก (ครั้ง)','ห้องที่ตรวจ','ครอบคลุม','ผ่านครบ','มีปัญหา','ตรวจไม่ครบ','ผ่านครบ (%)','ปัญหา ประตู','ปัญหา ตู้เซฟ','ปัญหา TV','ปัญหา สาย LAN']);
  let r=5;
  const writeMonthRow=function(label,st,zebra,isTotal){
    const row=s1.getRow(r);
    const covV=TOTAL?st.rooms/TOTAL:0, passV=st.rooms?st.pass/st.rooms:0;
    const vals=[label,st.saves,st.rooms,{formula:'IFERROR(C'+r+'/$B$3,0)',result:covV},st.pass,st.bad,st.inc,{formula:'IFERROR(E'+r+'/C'+r+',0)',result:passV}].concat(CHECKS.map(c=>st.issues[c]));
    vals.forEach((v,i)=>{
      const c=row.getCell(i+1); c.value=v;
      const o={align:i===0?'left':'center',bold:isTotal||i===0,bg:isTotal?XC.greenLt:(zebra?XC.grayLt:undefined)};
      if(i===3||i===7){ const p=xPct(i===3?covV:passV); o.color=p.color; o.bg=p.bg; o.numFmt='0%'; o.bold=true; }
      if(i===5&&st.bad>0){ o.color=XC.red; o.bold=true; }
      if(i>=8&&v>0){ o.color=XC.red; o.bg=XC.redLt; o.bold=true; }
      xCell(c,o);
    });
    row.height=22; r++;
  };
  keys.forEach((k,i)=>writeMonthRow(monthLabel(k),tally(byMonth[k]),i%2===1,false));
  writeMonthRow('ภาพรวมล่าสุด',tally(scope),false,true);
  r++;
  ['หมายเหตุ',
   '• ห้องที่ตรวจ / ผ่านครบ / มีปัญหา / ปัญหาแต่ละรายการ นับจากการบันทึกครั้งล่าสุดของแต่ละห้องในเดือนนั้น',
   '• บันทึก (ครั้ง) = จำนวนครั้งที่กดบันทึกทั้งหมด · ตรวจไม่ครบ = มีรายการที่ยังไม่ได้เลือก และไม่มีรายการมีปัญหา',
   '• ครอบคลุม = ห้องที่ตรวจ ÷ ห้องทั้งหมด · ภาพรวมล่าสุด = สถานะล่าสุดของทุกห้องจากทุกเดือน',
   '• สถานะห้อง (ผ่านครบ/มีปัญหา) นับจาก ประตู ตู้เซฟ TV เท่านั้น · สาย LAN เป็นแค่บันทึกว่าทำแล้ว'
  ].forEach((t,i)=>{
    s1.mergeCells(r,1,r,12);
    const c=s1.getCell(r,1); c.value=t;
    c.font={name:XFONT,size:10,bold:i===0,color:{argb:XC.gray}}; c.alignment={vertical:'middle',horizontal:'left'};
    r++;
  });

  // ---------- Sheet 2: สรุปตามตึก ----------
  const s2=xSheet(wb,'สรุปตามตึก');
  [14,10,12,12,12,11,11,13,13,11,12,10,13].forEach((w,i)=>{ s2.getColumn(i+1).width=w; });
  xTitle(s2,'สรุปผลการตรวจแยกตามตึก รายเดือน','ออกรายงาน '+today+' · ขอบเขต: '+scopeLabel,13);
  xHeader(s2,4,['เดือน','ตึก','ห้องทั้งหมด','ตรวจแล้ว','ครอบคลุม','ผ่านครบ','มีปัญหา','ตรวจไม่ครบ','ผ่านครบ (%)','ปัญหา ประตู','ปัญหา ตู้เซฟ','ปัญหา TV','ปัญหา สาย LAN']);
  let rr=5;
  keys.forEach((k,mi)=>{
    for(let b=1;b<=5;b++){
      if(bf&&+bf!==b) continue;
      const arr=byMonth[k].filter(e=>String(e.bldg)===String(b));
      if(!arr.length) continue;
      const st=tally(arr), tot=roomsOfBldg(b), row=s2.getRow(rr);
      const covV=tot?st.rooms/tot:0, passV=st.rooms?st.pass/st.rooms:0;
      const vals=[monthLabel(k),'ตึก '+b,tot,st.rooms,{formula:'IFERROR(D'+rr+'/C'+rr+',0)',result:covV},st.pass,st.bad,st.inc,{formula:'IFERROR(F'+rr+'/D'+rr+',0)',result:passV}].concat(CHECKS.map(c=>st.issues[c]));
      vals.forEach((v,i)=>{
        const c=row.getCell(i+1); c.value=v;
        const o={align:i===0?'left':'center',bold:i<=1,bg:mi%2===1?XC.grayLt:undefined};
        if(i===4||i===8){ const p=xPct(i===4?covV:passV); o.color=p.color; o.bg=p.bg; o.numFmt='0%'; o.bold=true; }
        if(i===6&&st.bad>0){ o.color=XC.red; o.bold=true; }
        if(i>=9&&v>0){ o.color=XC.red; o.bg=XC.redLt; o.bold=true; }
        xCell(c,o);
      });
      row.height=22; rr++;
    }
  });

  // ---------- Sheet 3: ประวัติทั้งหมด ----------
  const detail=sf?scope.filter(x=>statusOf(x)===sf):scope;
  const s3=xSheet(wb,'ประวัติทั้งหมด');
  [12,17,8,8,14,10,24,10,24,10,24,20,10,24,26,13].forEach((w,i)=>{ s3.getColumn(i+1).width=w; });
  xTitle(s3,'ประวัติการตรวจห้องพักทั้งหมด','ออกรายงาน '+today+' · ขอบเขต: '+scopeLabel+(sf?' · สถานะ: '+(sf==='complete'?'ผ่านครบ':'มีปัญหา'):'')+' · '+detail.length+' รายการ',16);
  xHeader(s3,4,['เดือน','วันที่/เวลา','ตึก','ห้อง','ผู้ตรวจ','ประตู','รายละเอียดปัญหา ประตู','ตู้เซฟ','รายละเอียดปัญหา ตู้เซฟ','TV','รายละเอียดปัญหา TV','รุ่น TV','สาย LAN','รายละเอียดปัญหา สาย LAN','หมายเหตุ','สถานะรวม']);
  const itemTxt=function(v){ return v==='ok'?'ปกติ':v==='bad'?'มีปัญหา':'-'; };
  detail.forEach((e,i)=>{
    const ck=e.checks||{}, cat=entryCat(e), row=s3.getRow(5+i);
    const vals=[monthLabel(monthKeyOf(e)),e.time||'',e.bldg?('ตึก '+e.bldg):'',e.room||'',e.checker||'',
      itemTxt(ck['ประตู']),ck['ประตู_desc']||'',itemTxt(ck['ตู้เซฟ']),ck['ตู้เซฟ_desc']||'',
      itemTxt(ck['TV']),ck['TV_desc']||'',e.tvModel||'',itemTxt(ck['สาย LAN']),ck['สาย LAN_desc']||'',
      e.note||'',cat==='pass'?'ผ่านครบ':cat==='bad'?'มีปัญหา':'ตรวจไม่ครบ'];
    vals.forEach((v,j)=>{
      const c=row.getCell(j+1); c.value=v;
      const o={align:'center',bg:i%2===1?XC.grayLt:undefined};
      if([6,8,10,13,14].indexOf(j)>=0){ o.align='left'; o.wrap=true; }
      if([5,7,9,12].indexOf(j)>=0){
        if(v==='ปกติ'){ o.color=XC.green; o.bg=XC.greenLt; }
        else if(v==='มีปัญหา'){ o.color=XC.red; o.bg=XC.redLt; o.bold=true; }
        else o.color=XC.gray;
      }
      if(j===15){
        if(v==='ผ่านครบ'){ o.color=XC.green; o.bg=XC.greenLt; o.bold=true; }
        else if(v==='มีปัญหา'){ o.color=XC.red; o.bg=XC.redLt; o.bold=true; }
        else { o.color=XC.amber; o.bg=XC.amberLt; o.bold=true; }
      }
      xCell(c,o);
    });
  });
  s3.autoFilter={from:{row:4,column:1},to:{row:4+Math.max(detail.length,1),column:16}};
  return wb;
}
// ==XLSX-END==

window.exportExcel = async function(){
  const bf=document.getElementById('hf-bldg').value;
  const sf=document.getElementById('hf-status').value;
  const scope=bf?dbHistory.filter(x=>String(x.bldg)===bf):dbHistory;
  if(!scope.length){ alert('ไม่มีข้อมูลสำหรับ Export'); return; }
  if(!window.ExcelJS){ alert('โหลดตัวสร้าง Excel ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่'); return; }
  try{
    const wb=buildReportWorkbook(window.ExcelJS,dbHistory,bf,sf);
    const buf=await wb.xlsx.writeBuffer();
    const dateStr=new Date().toLocaleDateString('th-TH').replace(/\//g,'-');
    const fname='hotel-checklist-report'+(bf?'_ตึก'+bf:'_ทุกตึก')+(sf==='complete'?'_ผ่านครบ':sf==='partial'?'_มีปัญหา':'')+'_'+dateStr+'.xlsx';
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
  }catch(err){ console.error(err); alert('สร้างไฟล์ Excel ไม่สำเร็จ: '+err.message); }
};

renderRooms();
</script>
